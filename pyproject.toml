[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iht2pb"
version = "0.1.0"
description = "Reverse-engineered Inkbird IHT-2PB BLE protocol reference and CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "bleak>=2",
]

[project.scripts]
iht2pb = "iht2pb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
